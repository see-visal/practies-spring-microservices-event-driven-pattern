# here is iamserver application configuration
server:
  port: 9090
eureka:
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true
spring:
  application:
    name: iamserver
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:16852/itp_iam_db
    username: itpusr
    password: itp@168
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9090
